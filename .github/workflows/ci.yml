name: tests
on:
  push:
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fixtures and workflow are valid JSON
        run: |
          for f in workflow.json workflow.v2.json tickets.sample.json tickets.adversarial.json tickets.heldout.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"
          done
      - name: Offline logic tests (Code nodes only, no network, no API key)
        run: node test-logic.mjs
      - name: No credentials or webhook URLs committed
        run: |
          ! grep -nE 'hooks\.slack\.com/services|AIza[0-9A-Za-z_-]{20,}|"credentials"' workflow.json workflow.v2.json
