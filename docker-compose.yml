# Local n8n for trying the demo. Bound to localhost only; do not expose it to the internet as is.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.7
    container_name: n8n-ticket-triage
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=UTC
      - TZ=UTC
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data:
